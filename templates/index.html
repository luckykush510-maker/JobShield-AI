<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobShield AI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                🛡️ JobShield AI
            </span>
        </div>
    </nav>

    <!-- Main Section -->
    <div class="container mt-5">

        <div class="text-center mb-4">
            <h1>Fake Job & Internship Detection</h1>

            <p class="text-muted">
                Check whether a job opportunity looks genuine or suspicious.
            </p>
        </div>

        <!-- Form Card -->
        <div class="card shadow p-4">

            <h3 class="mb-4">Enter Job Details</h3>

         <form method="POST" action="/check">
            {% if error %}
    <p style="color: red; font-weight: bold;">
        {{ error }}
    </p>
{% endif %}

                <div class="mb-3">
                    <label class="form-label">Job Title</label>
                    <input type="text"
       name="job_title"
       class="form-control"
       placeholder="Example: Python Developer">
                </div>

                <div class="mb-3">
                    <label class="form-label">Company Name</label>
                    <input type="text"
       name="company"
       class="form-control"
       placeholder="Enter company name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Job Description</label>
                    <textarea name="description"
          class="form-control"
          rows="6"
          placeholder="Paste job description here"></textarea>
                </div>
                <div class="mb-3">
    <label class="form-label">Offer Letter Text</label>

    <textarea
        name="offer_letter"
        class="form-control"
        rows="6"
        placeholder="Paste offer letter text here"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Salary</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Example: ₹25,000 per month">
                </div>

                <div class="mb-3">
                    <label class="form-label">Recruiter Email</label>
                    <input type="email"
       name="email"
       class="form-control"
       placeholder="example@company.com">
                </div>
                <div class="mb-3">
    <label class="form-label">Recruiter Phone Number</label>
    <input type="tel"
           name="phone"
           class="form-control"
           placeholder="Enter recruiter phone number">
</div>

                <button type="submit" class="btn btn-primary w-100">
                    🔍 Check Job
                </button>

            </form>

        </div>

    </div>

</body>
</html>
